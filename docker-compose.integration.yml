services:
  postgres-integration:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forex_integration_test
      POSTGRES_USER: forex_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Define POSTGRES_TEST_PASSWORD no ambiente}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: "no"
